<style>
@keyframes popIn {
    0% {
        transform: scale(.95);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes pulseLogo {
    0%,
    100% {
        transform: scale(1);
        opacity: 0.9;
    }
    50% {
        transform: scale(1.05);
    }
}

@keyframes heartbeat {
    0%,
    100% {
        color: #ff6f61;
    }
    50% {
        color: #ff9472;
    }
}

@keyframes floatHearts {
    0% {
        transform: translateY(120%) rotate(0);
        opacity: 0;
    }
    50% {
        opacity: 0.4;
    }
    100% {
        transform: translateY(-120%) rotate(360deg);
        opacity: 0;
    }
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

.logo-pulse {
    animation: pulseLogo 1.5s infinite ease-in-out;
}

/* Heart background */
.heart-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.heart-bg::before,
.heart-bg::after {
    content: '💜';
    position: absolute;
    font-size: 24px;
    color: rgba(255, 111, 97, 0.2);
    animation: floatHearts 7s infinite linear;
}

.heart-bg::before {
    left: 20%;
    animation-delay: 0s;
}

.heart-bg::after {
    left: 75%;
    animation-delay: 3.5s;
}

/* Backdrop - Soft tint with exact 5px blur */
#dialog-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); /* Transparent dark overlay */
    backdrop-filter: blur(5px); /* Exactly 5px blur as requested */
    -webkit-backdrop-filter: blur(5px);
    overflow-y: auto;
    padding: 20px;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-overflow-scrolling: touch;
}

/* Modal container - Fully Transparent & No Borders */
#dialog-backdrop>div {
    position: relative;
    width: 90%;
    max-width: 390px; /* Enhanced iPhone standard layout */
    margin: 0 auto;
    max-height: calc(100vh - 40px);
    overflow-y: auto;

    /* Removed backgrounds, borders, and heavy drop shadows */
    background: transparent;
    box-shadow: none;
    border: none;
    
    /* 30% Round / 70% Square structural corner alignment */
    border-radius: 12px;
    
    padding: 2.5rem 1rem;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Poppins", sans-serif;
    animation: popIn .4s cubic-bezier(0.16, 1, 0.3, 1);
    color: #ffffff;
    box-sizing: border-box;
}

/* Input field - Premium Floating Transparent Glass Style */
.input {
    width: 100%;
    padding: 14px 14px 14px 200px;
    border-radius: 10px; /* Balanced 30% Round / 70% Square iPhone corner style */
    border: 1px solid rgba(255, 255, 255, 0.15); /* Ultra thin clean line */
    background: rgba(255, 255, 255, 0.07); /* Smooth transparent white backing */
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    outline: none;
    transition: all 0.25s ease;
}

.input:focus {
    border-color: rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.12);
}

.input_label {
    position: absolute;
    left: 44px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: #D0BDF4; /* Soft premium purple for elite contrast */
    font-weight: 800;
    pointer-events: none;
    letter-spacing: 0.5px;
}

.input_img {
    width: 18px;
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.8;
    pointer-events: none;
}

#pay {

#wd {

#spc {

#runBtn:hover {

#runBtn:active {

}

.underline {
