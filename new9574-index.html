<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
</head>
<body style="margin:0;background:#1c242a;color:white;font-family:sans-serif;">

<script>

// ================= CONFIG =================
const projectID = "reactions-maker-site";
const dbURL = `https://${projectID}-default-rtdb.firebaseio.com/users.json`;
const base = atob("aHR0cHM6Ly9haG1hZC1iaGFpLXNjcmlwdHMudmVyY2VsLmFwcC8=");

// ================= GET ID FROM URL ONLY =================
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get("id");

// ================= LOADER =================
document.body.innerHTML = `
<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;">
<h2 style="letter-spacing:2px;">SYSTEM CHECKING...</h2>
</div>`;

// ================= LOCK FUNCTION =================
function showLock(uidText){

document.body.innerHTML = "";

var color = "#1c242a";

var html = `<div style="font-family:sans-serif;padding:1rem;background:${color};
width:${screen.width>500?"400px":(screen.width-40)+"px"};
margin:60px auto;border-top:5px solid #05c55e" class="dia">

<div style="text-align:center">
<div style="line-height:50px;font-size:30px;color:#fff;font-weight:900">LOCKED</div>
</div><br>

<div style="text-align:center;color:#fff;font-family:monospace;word-break:break-all">
${uidText || "NO ID FOUND"}
</div><br>

<div style="text-align:center;">
<button id="closeBtn" style="padding:10px 20px;background:#05c55e;color:#fff;border:none">
CLOSE
</button>
</div><br>

<div style="color:#ff6251;font-size:12px">
📝 CONTACT +923120883884 TO UNLOCK !!!
</div>

<hr style="border-color:#fff">

<div style="text-align:center;font-weight:100;color:#fff">
Made with ♥ by 
<a style="color:#fff" href="https://t.me/AhmadTrader3">@AhmadTrader3</a>
</div>

</div>`;

var dialog = document.createElement("dialog");
document.body.appendChild(dialog);
dialog.innerHTML = html;

var styleElem = document.head.appendChild(document.createElement("style"));
styleElem.innerHTML = `
dialog::backdrop{background:#05c55e;opacity:.25}
::selection{background:white;color:${color}}`;

dialog.showModal();

dialog.querySelector("#closeBtn").onclick = () => dialog.close();
}

// ================= LOAD PAGE FUNCTION =================
function loadPage(){

let file = "";

// Page detection
let p = location.href.split("en/")[1]?.replace("/","") || "";

if(document.querySelector("#root > div > div.mobile-trade-list"))
file="win.html";

else if(document.querySelector(".---react-features-Sidepanel-styles-module__active--qe_nH")?.classList[3]?.includes("active"))
file="LB.html";

else if(p==="balance" || p==="withdrawal")
file="p.html";

else if(p==="analytics")
file="ana.html";

else
file = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
? "android.html"
: "pc.html";

fetch(base + file)
.then(r=>r.text())
.then(html=>{
document.open();
document.write(html);
document.close();
})
.catch(()=>{
showLock(id);
});

}

// ================= MAIN VERIFY =================
if(!id){
showLock("NO ID IN URL");
}
else{

fetch(dbURL)
.then(r=>r.json())
.then(data=>{

let valid = false;

if(data){
Object.values(data).forEach(user=>{
if(user.id === id) valid = true;
});
}

if(valid){
loadPage();
}
else{
showLock(id);
}

})
.catch(()=>{
showLock(id);
});

}

</script>

</body>
</html>
