<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCKED 🔒</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
  }
  #lock-container {
    text-align: center;
  }
  #unlock-img {
    display: none;
    max-width: 90%;
    border: 3px solid #fff;
    border-radius: 12px;
  }
  #id-display {
    margin-top: 20px;
    color: #0f0;
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="lock-container">
  <h1>🔒 Locked</h1>
  <img id="unlock-img" src="https://i.ibb.co/B5qd2j9h/IMG-20251221-190644-639.jpg" alt="Unlocked">
  <div id="id-display"></div>
</div>

<script>
// ================= UNIQUE ID SYSTEM =================
function generateID(length = 20) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let id = '';
  for(let i = 0; i < length; i++){
    id += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return id;
}

// Get ID from URL or localStorage
const urlParams = new URLSearchParams(window.location.search);
let userID = urlParams.get('id');

if(!userID){
  userID = localStorage.getItem('user_unique_id');
  if(!userID){
    userID = generateID();
    localStorage.setItem('user_unique_id', userID);
  }
  // Update URL with ID
  window.history.replaceState(null, null, `?id=${userID}`);
}

// Show ID for debug
document.getElementById('id-display').innerText = "Your ID: " + userID;

// ================= LOCK / UNLOCK =================
let unlocked = false;

function unlock() {
  unlocked = true;
  document.querySelector('h1').style.display = 'none';
  document.getElementById('unlock-img').style.display = 'block';
  document.title = "UNLOCKED ✅";
}

// ================= FIREBASE CHECK =================
const firebaseURL = "https://reactions-maker-site-default-rtdb.firebaseio.com/users.json";

// Check if user is unlocked in Firebase
function checkFirebaseUnlock(id){
  fetch(firebaseURL)
    .then(res => res.json())
    .then(data => {
      if(data && data[id] && data[id].unlocked && !unlocked){
        unlock();
      }
    })
    .catch(err => console.log("Firebase error:", err));
}

// Auto-create user in Firebase if not exist
function createUserIfNotExist(id){
  fetch(`https://reactions-maker-site-default-rtdb.firebaseio.com/users/${id}.json`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ unlocked: false })
  })
  .then(res => res.json())
  .then(data => console.log("User initialized:", data))
  .catch(err => console.log("Firebase error:", err));
}

createUserIfNotExist(userID);

// Check Firebase every 2 seconds
setInterval(() => checkFirebaseUnlock(userID), 2000);

</script>
</body>
</html>
