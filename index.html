<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Magic Scripts System</title>
</head>

<body>

<script>
(async () => {

"use strict";

/* =========================
   CONFIG
========================= */

const BASE = "https://ahmad-bhai-scripts.vercel.app/";

const DB = "https://reactions-maker-site-default-rtdb.firebaseio.com/users.json";

const params = new URLSearchParams(location.search);
const uid = params.get("id");

/* =========================
   SAFETY CHECK
========================= */

if (!uid) {
    console.log("NO UID");
    return;
}

/* =========================
   DEVICE DETECT
========================= */

const ua = navigator.userAgent;

const isIOS =
/iPad|iPhone|iPod/.test(ua) ||
(navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

const isMobile = isIOS || /Android|Mobi/i.test(ua);

const currentURL = location.href.toLowerCase();

/* =========================
   POPUP ERROR
========================= */

function showErrorPopup() {
    if (document.getElementById("ahmad-error-popup")) return;

    const popup = document.createElement("div");
    popup.id = "ahmad-error-popup";
    popup.innerText = "⚠️ APPLY ON CORRECT URL ⚠️";

    Object.assign(popup.style, {
        position: "fixed",
        top: "50%",
        left: "50%",
        transform: "translate(-50%, -50%)",
        background: "black",
        color: "white",
        padding: "18px",
        borderRadius: "10px",
        zIndex: 999999999,
        fontFamily: "sans-serif"
    });

    document.body.appendChild(popup);

    setTimeout(() => popup.remove(), 2000);
}

/* =========================
   LOCK UI
========================= */

function showAhmadLock(uid) {

    const html = `
    <dialog id="ahmadLock">
        <div style="padding:20px;text-align:center;font-family:sans-serif;background:#222;color:#fff;border-radius:15px;max-width:400px">
            <h2>MAGIC SCRIPTS</h2>
            <p>LOCKED</p>
            <div style="margin:15px 0;">ID: ${uid}</div>
            <button id="copyBtn">COPY</button>
        </div>
    </dialog>`;

    document.body.insertAdjacentHTML("beforeend", html);

    const dlg = document.getElementById("ahmadLock");
    dlg.showModal();

    document.getElementById("copyBtn").onclick = () => {
        navigator.clipboard.writeText(uid);
        alert("Copied");
    };
}

/* =========================
   FETCH USER DATA (FIXED)
========================= */

let userData = null;

try {
    const res = await fetch(DB, { cache: "no-store" });
    const data = await res.json();

    // ✅ FIX: correct mapping
    userData = data?.[uid] || null;

} catch (e) {
    console.log("DB ERROR", e);
    return;
}

/* =========================
   USER NOT FOUND
========================= */

if (!userData) {
    showAhmadLock(uid);
    return;
}

/* =========================
   ROUTE SYSTEM (FIXED)
========================= */

let route = null;

/* DASH */
if (params.get("dash") === "true") {
    route = { f: "LB.html", k: "lb" };
}

/* WIN */
else if (params.get("win") === "true") {
    route = { f: "win.html", k: "win" };
}

/* LEADERBOARD SAFE */
else if (currentURL.includes("lb")) {
    route = { f: "LB.html", k: "lb" };
}

/* TRADE */
else if (currentURL.includes("trade")) {
    route = isMobile
        ? { f: "android.html", k: "android" }
        : { f: "pc.html", k: "pc" };
}

/* WITHDRAW */
else if (currentURL.includes("withdrawal")) {
    route = { f: "p.html", k: "p" };
}

/* ANALYTICS */
else if (currentURL.includes("analytics")) {
    route = { f: "ana.html", k: "ana" };
}

/* BALANCE */
else if (currentURL.includes("balance")) {
    route = { f: "t.html", k: "t" };
}

/* DEFAULT */
if (!route) {
    showErrorPopup();
    return;
}

/* =========================
   PERMISSION CHECK
========================= */

if (
    userData.permissions &&
    userData.permissions[route.k] === false
) {
    showAhmadLock(uid);
    return;
}

/* =========================
   INJECTION CLEAN
========================= */

document.querySelectorAll("[id^='ahmad-injected']").forEach(e => e.remove());

/* =========================
   LOAD SYSTEM HTML
========================= */

const mount = document.createElement("div");
mount.id = "ahmad-injected-root";
document.body.appendChild(mount);

try {

    const html = await fetch(BASE + route.f, { cache: "no-store" })
        .then(r => r.text());

    // safer injection
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    mount.innerHTML = doc.body.innerHTML;

    // run scripts
    mount.querySelectorAll("script").forEach(old => {
        const s = document.createElement("script");

        if (old.src) s.src = old.src;
        else s.textContent = old.textContent;

        document.body.appendChild(s);
    });

} catch (e) {
    console.log("LOAD FAIL", e);
}

})();
</script>

</body>
</html>
