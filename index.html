<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHATGRAM AI</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712031.png">
  <style>
    /* ===== Reset & Basic ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
    body { background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; }
    .chat-container { width:100%; max-width:500px; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); display:flex; flex-direction:column; overflow:hidden; }
    
    /* ===== Header ===== */
    .chat-header { background:#4f46e5; color:#fff; padding:15px; text-align:center; font-size:20px; font-weight:bold; }
    
    /* ===== Messages ===== */
    .chat-messages { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .message { padding:10px 15px; border-radius:12px; max-width:80%; word-wrap:break-word; }
    .user { background:#e0e0e0; align-self:flex-end; }
    .bot { background:#4f46e5; color:#fff; align-self:flex-start; }
    
    /* ===== Input ===== */
    .chat-input { display:flex; border-top:1px solid #ddd; }
    .chat-input input { flex:1; border:none; padding:15px; font-size:16px; }
    .chat-input button { background:#4f46e5; color:#fff; border:none; padding:0 20px; cursor:pointer; font-size:16px; }
    .chat-input input:focus { outline:none; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">CHATGRAM AI</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');

    const OPENAI_API_KEY = "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"; // 🔑 Yahan apna GPT-4 API key dal do

    async function sendMessage() {
      const message = userInput.value.trim();
      if(!message) return;

      // Show user's message
      addMessage(message, 'user');
      userInput.value = '';

      // Show loading bot message
      const botMsg = addMessage('Loadddding...', 'bot');

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4",
            messages: [{role: "user", content: message}],
            temperature: 0.7,
            max_tokens: 500
          })
        });

        const data = await response.json();
        const botText = data.choices[0].message.content.trim();
        botMsg.innerText = botText;

      } catch (error) {
        botMsg.innerText = "Error: Could not reach AI. 😞";
        console.error(error);
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerText = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msg;
    }

    // Send message on Enter key
    userInput.addEventListener('keypress', function(e) {
      if(e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
