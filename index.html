<style>
    @keyframes popIn { 0% { transform: scale(.6); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
    @keyframes pulseLogo { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.12) } }
    @keyframes floatHearts { 
        0% { transform: translateY(120%) rotate(0); opacity: 0 } 
        50% { opacity: 0.7 } 
        100% { transform: translateY(-120%) rotate(360deg); opacity: 0 } 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    .logo-pulse { animation: pulseLogo 1.5s infinite ease-in-out; }
    .heart-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .heart-bg::before, .heart-bg::after { content: '💜'; position: absolute; font-size: 28px; color: rgba(255, 111, 97, 0.25); animation: floatHearts 7s infinite linear; }
    .heart-bg::before { left: 20%; animation-delay: 0s; }
    .heart-bg::after { left: 75%; animation-delay: 3.5s; }

    #dialog-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); overflow-y: auto; padding: 20px; z-index: 9999; display: none; }
    #dialog-backdrop>div { position: relative; width: 90%; max-width: 420px; margin: 0 auto; background: linear-gradient(145deg, #111 0%, #1f1f1f 100%); box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7); border-radius: 25px; padding: 3rem 1.5rem; text-align: center; font-family: 'Poppins', sans-serif; animation: popIn .8s ease-out; color: #e0e0e0; border: 1px solid #333; }

    .input { width: 100%; padding: 14px 14px 14px 110px; border-radius: 50px; border: none; background: #222; color: #fff; font-weight: 600; font-size: 16px; outline: none; transition: 0.3s; text-transform: uppercase; text-decoration: underline; }
    .input_label { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #5E177D; font-weight: 800; pointer-events: none; }
    .input_img { width: 20px; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); opacity: 0.9; }

    #runBtn { width: 100%; margin-top: 20px; padding: 14px 28px; background: linear-gradient(135deg, #5E177D 0%, #3E075A 50%, #D0BDF4 100%); color: #fff; border: none; border-radius: 50px; font-weight: 700; font-size: 18px; cursor: pointer; transition: 0.3s; }
</style>

<div id="dialog-backdrop">
    <div id="modal-container">
        <div class="heart-bg"></div>
        <div style="font-size:2rem;font-weight:900;color:#fff;margin-bottom:5px;">MAGIC SCRIPTS</div>
        <div style="font-size:0.9rem;color:#DC8DE6; margin-bottom:1.5rem; letter-spacing:1px;">(LIVE MODE)</div>
        <div style="margin-bottom:25px; display:flex; justify-content:center;"><img src="https://i.ibb.co/6CyKYR0/logo.png" style="width:110px;height:110px;" class="logo-pulse"></div>
        
        <div style="position:relative; width:100%; margin-bottom:8px; text-align:left;">
            <div id="flagInput" style="padding:14px 20px; border-radius:50px; background:#222; color:#fff; cursor:pointer; display:flex; align-items:center; position:relative;">
                <img id="flagImg" style="margin-right:14px;" width="16px">
                <span id="flagText" style="font-size: 16px;text-transform: uppercase;"></span>
                <div id="flagDropdown" style="display:none; position:absolute; top:100%; left:0; width:100%; max-height:150px; overflow-y:auto; background:#222; border-radius:10px; margin-top:5px; z-index:10;"></div>
            </div>
        </div>

        <div style="position:relative; width:100%; margin-bottom:8px;">
            <img class="input_img user_img" src="https://i.ibb.co/nNhbZXyb/user.png" />
            <span class="input_label">USER</span>
            <input class="input" id="user" type="text" value="MAGIC SCRIPTS">
        </div>

        <div style="position:relative; width:100%; margin-bottom:8px;">
            <img class="input_img id_img" src="https://i.ibb.co/Hfc1pmRn/id.png" />
           <span class="input_label">ID</span>
            <input class="input" id="id" type="number" value="12345678">
        </div>

        <div style="position:relative; width:100%; margin-bottom:8px;">
            <img class="input_img email_img" src="https://i.ibb.co/Q3VwcgwH/email.png" />
            <span class="input_label">EMAIL</span>
            <input class="input" id="email" type="email" value="magic.scripts@gmail.com">
        </div>

        <button id="runBtn">RUN MAGIC 🪄 </button>
        <div id="syncStatus" style="text-align: center;color:#11a155;margin-top: 1.5rem; font-size: 12px; font-weight: bold;">🔄 CONNECTING TO FIREBASE...</div>
    </div>
</div>

<script>
(function() {
    var baseURL = "https://ahmad-bhai-scripts.vercel.app/";
    var flagList = [["pk", "Pakistan"], ["in", "India"], ["bd", "Bangladesh"], ["sa", "Saudi Arabia"], ["ae", "United Arab Emirates"], ["tr", "Turkey"], ["lk", "Sri Lanka"], ["au", "Australia"], ["jp", "Japan"], ["np", "Nepal"], ["eg", "Egypt"], ["my", "Malaysia"], ["th", "Thailand"], ["kr", "South Korea"], ["ng", "Nigeria"], ["mx", "Mexico"]];

    var flagInput = document.getElementById("flagInput");
    var flagDropdown = document.getElementById("flagDropdown");
    var flagImg = document.getElementById("flagImg");
    var flagText = document.getElementById("flagText");

    // Setup Flags
    flagText.innerText = "Pakistan";
    flagImg.src = `https://flagcdn.com/16x12/pk.png`;
    window.selectedFlag = "pk";

    flagList.forEach(f => {
        const div = document.createElement("div");
        div.style = "padding:8px 15px; display:flex; align-items:center; cursor:pointer;";
        div.innerHTML = `<img src="https://flagcdn.com/16x12/${f[0]}.png" style="margin-right:8px;">${f[1]}`;
        div.onclick = (e) => {
            e.stopPropagation();
            flagImg.src = `https://flagcdn.com/16x12/${f[0]}.png`;
            flagText.innerText = f[1];
            window.selectedFlag = f[0];
            flagDropdown.style.display = "none";
        };
        flagDropdown.appendChild(div);
    });

    flagInput.onclick = (e) => { e.stopPropagation(); flagDropdown.style.display = flagDropdown.style.display === "block" ? "none" : "block"; };
    document.onclick = () => flagDropdown.style.display = "none";

    // --- SYNC & RESTORE LOGIC ---
    async function fillUserData() {
        const savedUniqueID = localStorage.getItem('ahmad_script_uid');
        if (!savedUniqueID) return;
        try {
            const response = await fetch("https://reactions-maker-site-default-rtdb.firebaseio.com/users.json");
            const allUsers = await response.json();
            for (let key in allUsers) {
                if (allUsers[key].id === savedUniqueID) {
                    const u = allUsers[key];
                    if (u.name) document.getElementById('user').value = u.name;
                    if (u.trader_id) document.getElementById('id').value = u.trader_id; 
                    if (u.email) document.getElementById('email').value = u.email;
                    if (u.flag) {
                        window.selectedFlag = u.flag;
                        flagImg.src = `https://flagcdn.com/16x12/${u.flag}.png`;
                        flagText.innerText = flagList.find(f => f[0] === u.flag)?.[1] || u.flag;
                    }
                    document.getElementById("syncStatus").innerText = "✅ CLOUD SYNCED";
                    break;
                }
            }
        } catch (e) { console.log("Cloud Error"); }
    }

    const runMagic = () => {
        var user = document.querySelector("#user").value;
        var id = document.querySelector("#id").value;
        var email = document.querySelector("#email").value.toLowerCase();
        var flag = window.selectedFlag || "pk";
        var inr__rate = 90;

        // Save for Reload
        localStorage.setItem('ahmad_magic_session', JSON.stringify({user, id, email, flag}));

        // UI Clean
        const backdrop = document.getElementById("dialog-backdrop");
        if (backdrop) backdrop.style.display = "none";
        document.querySelectorAll("dialog").forEach(d => d.remove());
        
        // Anti-Logout & Modding
        window.onbeforeunload = () => null;
        if (window.settings) { window.settings.token = "ZXYIcWhHseBMZwqG3qkfglPRCbX8U11t6dD0N7jJ"; window.settings.isDemo = 1; }

        const liveLabel = document.querySelector("div.58LeE > div.SfrTV.TmWTp");
        if(liveLabel) { liveLabel.innerText = "live"; liveLabel.style.color = "#0faf59"; }
        history.pushState({}, null, "/en/trade");
        document.title = "Live trading | Quotex";

        // --- LEADERBOARD & BALANCE LOGIC ---
        var carret = document.querySelector("#root > div.app.app--fixed.animate > div.app__page.LIAp0 > header > div.lqUUw > div.rymiA > div");
        var state__carret = true;
        
        const LEADER__POS = (sum) => {
            var pos__el = document.querySelector("#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.MUXvc > div.K9Ykc > div.iKtL6");
            if(!pos__el) return;
            var pos = sum > 0 ? Math.floor(60962 / sum) : 60962 - Math.floor(Math.random() * 100);
            if (pos < 21) pos += 20;
            pos__el.innerHTML = sum == 0 ? `<div class="ocuJC">Your position:</div> -` : `<div class="ocuJC">Your position:</div>${Math.abs(pos)}`;
        };

        const LEADER__PLACE = (sum) => {
            (function exists() {
                const leaders = document.querySelectorAll("#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.LTZTE > div");
                if (!leaders.length) return setTimeout(exists, 100);
                Array.from(leaders).some((l, i) => {
                    const l_profit = document.querySelector(`#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.LTZTE > div:nth-child(${i + 1}) > div.jJUGd.ETyBt`);
                    if (parseFloat(l_profit.innerHTML.replace(/\$|\,/g, "")) <= sum) {
                        const l_flag = document.querySelector(`#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.LTZTE > div:nth-child(${i + 1}) > div.s4L5S > div.zCluU > svg > use`);
                        l_flag.setAttribute("xlink:href", `/profile/images/flags.svg#flag-${flag.toLowerCase()}`);
                        document.querySelector(`#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.LTZTE > div:nth-child(${i + 1}) > div.s4L5S > div.MrPOZ`).innerHTML = user;
                        l_profit.innerHTML = sum >= 30000 ? `$30,000.00+` : `$${sum.toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
                        return true;
                    }
                });
            })();
        };

        const TradesCalc = () => {
            const container = document.querySelector(".Qsdmi.xpiuY");
            const firstDate = container?.querySelector(".Z8T_E");
            if (firstDate) {
                var results = [];
                var utc = new Date(new Date().getTime() - 1800000).getDate();
                if (Number(firstDate.innerText.split(" ")[0]) == utc) {
                    let el = firstDate.nextElementSibling;
                    while (el && !el.classList.contains("Z8T_E")) {
                        if (el.id !== "trade-item-open") {
                            var p_str = el.querySelector("div.h6J0L").innerText;
                            var p_val = p_str.replace(/,/g, '').match(/\d+(\.\d+)?/g).map(Number);
                            var res = p_str.at(-1) === "₹" ? (p_val[1] - p_val[0]) / inr__rate : (p_val[1] - p_val[0]);
                            results.push(res);
                        }
                        el = el.nextElementSibling;
                    }
                    if (results.length > 0) {
                        var sum = results.reduce((a, b) => a + b, 0);
                        LEADER__POS(sum); LEADER__PLACE(sum);
                        var pl_l = document.querySelector(".BwWCZ.LD4pW");
                        if (pl_l) {
                            pl_l.innerText = (sum >= 0 ? "$" : "") + sum.toLocaleString("en", { minimumFractionDigits: 2 });
                            pl_l.className = sum >= 0 ? "BwWCZ LD4pW" : "BwWCZ qUPWg";
                        }
                    }
                }
            }
        };

        const BALANCE__ICON = () => {
            var b_el = document.querySelector(".pVBHU");
            if(!b_el) return;
            var bal = parseFloat(b_el.innerText.replace(/,|\$|\₹/g, ''));
            var lvl = bal >= (b_el.innerText[0]==="$"?10000:830000) ? "vip" : (bal >= (b_el.innerText[0]==="$"?5000:415000) ? "pro" : "standart");
            document.querySelector(".ePf8T svg use").setAttribute("xlink:href", `/profile/images/spritemap.svg#icon-profile-level-${lvl}`);
        };

        // Click handler for Sidebar
        top.onclick = () => {
            const fl_el = document.querySelector(".xN5cX svg use");
            if(fl_el) {
                fl_el.setAttribute("href", `/profile/images/flags.svg#flag-${flag}`);
                document.querySelector(".xN5cX p").textContent = user;
                TradesCalc();
            }
        };

        const DROPDOWN = () => {
            document.querySelector(".hPbO9 li div.OZX4_ div div").innerText = email;
            document.querySelector(".hPbO9 li div.OZX4_ div span").innerText = `ID: ${id}`;
            var live_li = document.querySelector(".hPbO9 div li:nth-child(1)");
            var demo_li = document.querySelector(".hPbO9 div li:nth-child(2)");
            if(live_li && demo_li && !window.dropdownDone) {
                live_li.querySelector("a").innerText = "Demo Account";
                demo_li.querySelector("a").innerText = "Live Account";
                live_li.querySelector("b")?.remove();
                demo_li.parentNode.insertBefore(demo_li, live_li);
                window.dropdownDone = true;
            }
        };

        if(carret) carret.onclick = () => setTimeout(DROPDOWN, 10);

        BALANCE__ICON();
        new MutationObserver(BALANCE__ICON).observe(document.querySelector(".pVBHU"), {subtree:true, characterData:true});
        console.log("Ahmad Bhai Magic Active!");
    };

    // --- MAIN INITIALIZER ---
    const session = localStorage.getItem('ahmad_magic_session');
    if (session) {
        // Instant Restore (Reload System)
        const data = JSON.parse(session);
        document.getElementById('user').value = data.user;
        document.getElementById('id').value = data.id;
        document.getElementById('email').value = data.email;
        window.selectedFlag = data.flag;
        setTimeout(runMagic, 100); 
    } else {
        // New User: Show Dialog
        document.getElementById("dialog-backdrop").style.display = "block";
        fillUserData();
    }

    document.getElementById("runBtn").onclick = runMagic;
})();
</script>
