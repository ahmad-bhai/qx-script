    document.onclick = () => flagDropdown.style.display = "none";

        // Validation failed silently without disrupting the UI
        if (!activeId) return;

            for (let key in allUsers) {
                if (allUsers[key] && allUsers[key].id === activeId) {

                    if (foundUser.trader_id) myDialog.querySelector('#id').value = foundUser.trader_id;

                        flagImg.src = `https://flagcdn.com/16x12/${foundUser.flag}.png`;

            statusEl.innerHTML = "🪄 ENJOY THE PRO VERSION! 🪄";

        } catch (e) { 
            statusEl.innerHTML = "🪄 ENJOY THE PRO VERSION! 🪄";
            statusEl.style.color = "#11a155";
        }
    }

    setTimeout(fillUserData, 200);

    // --- RUN SCRIPT ACTIONS ---
    document.querySelector("#runBtn").addEventListener("click", () => {
        if (document.querySelector("#win").value.toLowerCase() == "yes") {
            var trades = document.querySelectorAll("div[data-index]:not([data-index=\"0\"])");

        var flag = window.selectedFlag || "pk";
        var s_profit = Number(document.querySelector("#s_profit").value);

        document.querySelectorAll("dialog").forEach(d => d.remove());
        const backdrop = document.getElementById("dialog-backdrop");
        if (backdrop) backdrop.remove();
        const loader = document.getElementById("__my_loader__");
        if (loader) loader.remove();
        const banner = document.querySelector("main div[dir]");

        var live_el = document.querySelector("#header-mobile-asset-btn + * > :first-child > :first-child");
        live_el.querySelector(":nth-child(3) > :first-child").innerText = "live account";
        live_el.querySelector(":nth-child(3) > :first-child").style.color = "#0faf59";
        
        history.pushState({}, null, "/en/trade");
        document.title = "Live trading | Quotex";
        
        var carret = live_el.childNodes[1];
        var state__carret = true;
        var i_profit;

        const LEADER__POS = (sum) => {
            var leader_el = document.querySelector(".app__sidepanel > :last-child > :nth-child(2) > :first-child");
            var pos__el = leader_el.childNodes[3].childNodes[1];
            var pos;
            var my__orig__pos = 80000;

            if (sum > 0) pos = Math.floor(my__orig__pos / sum);
            else if (sum < 0) pos = my__orig__pos - Math.floor(Math.random() * 100 + 1);

            if (pos < 21) pos = pos + 20;

            if (sum != 0 && pos > 100) pos__el.nodeValue = `100+`;
            else if (sum == 0) pos__el.nodeValue = ``;
            else pos__el.nodeValue = `${Math.abs(pos)}`;
        };

        const LEADER__PLACE = (sum) => {
            (function exists() {
                const leaders = document.querySelectorAll(".M_p_O > :last-child > div");
                if (!leaders.length) return setTimeout(exists);
                Array.from(leaders).some((l) => {
                    const leader_profit = l.childNodes[2];
                    if(!leader_profit) return;
                    const leader_profit_simplify = parseFloat(leader_profit.innerHTML.replace(/\$|\,/g, ""));
                    if (leader_profit_simplify <= sum) {
                        const leader__flag = l.querySelector(`:nth-child(2) > :nth-child(2) > svg > use`);
                        if(!leader__flag) return;
                        leader__flag.setAttribute("href", `/profile/images/flags.svg#flag-${flag.toLowerCase()}`);
                        const leader_name = l.querySelector(`:nth-child(3)`);
                        leader_name.innerHTML = user;

                        if (sum >= 30000) leader_profit.innerHTML = `$30,000.00+`;
                        else leader_profit.innerHTML = `$${sum.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                        
                        const REAL_POS = l.querySelector(`:nth-child(2) > :first-child > div`).innerHTML;
                        document.querySelector(".app__sidepanel > :last-child > :nth-child(2) > :first-child").childNodes[3].childNodes[1].nodeValue = REAL_POS;
                        return true;
                    }
                });
            })();
        };

        const TradesCalc = () => {
            if (!i_profit) i_profit = s_profit;
            var leader_el = document.querySelector(".app__sidepanel").lastChild.childNodes[1].firstChild;
            var pl_text = leader_el.childNodes[1].lastChild;

        top.onclick = function () {

                const nameUser = el.querySelector("p");
                if (nameUser) nameUser.textContent = `${user}`;
                TradesCalc();
            })();
        };

        var limit__lower;
        var limit__upper;
        const BALANCE__ICON = () => {
            var balance__str = live_el.querySelector(":nth-child(3) > :last-child").innerText;
            var balance = parseFloat(balance__str.replace(/,|\$|\₹/g, ''));
            var currency = balance__str[0];

            else if (currency === "₹") { limit__lower = 415000; limit__upper = 830000; }
        
            var icon_el = live_el.querySelector(":nth-child(1) svg use");
            if ((balance >= limit__lower) && (balance < limit__upper)) {
                icon_el.setAttribute("xlink:href", "/profile/images/spritemap.svg#icon-profile-level-pro");

                icon_el.setAttribute("xlink:href", "/profile/images/spritemap.svg#icon-profile-level-vip");

            drop_el.querySelector(":nth-child(1) > :first-child > :first-child > :first-child svg use").setAttribute("xlink:href", main__icon);
        
            var prof__level = drop_el.querySelector(":nth-child(1) > :first-child > :first-child > :first-child > :last-child > :first-child").innerText = `${main__icon.split("-").pop()}:`;
            if (prof__level === "standart:") {
                drop_el.querySelector(":nth-child(1) > :first-child > :first-child > :first-child > :last-child > :first-child").innerText = "standard:";
            }
        
            var percentage__profit = drop_el.querySelector(":nth-child(1) > :first-child > :first-child > :last-child > :last-child");
            if (prof__level === "standart:") percentage__profit.innerText = "+0% profit";

            var drop_switching = document.querySelector("#header-mobile-asset-btn + * > :first-child > :nth-child(2) > :first-child > :last-child");
            var live__el = drop_switching.firstChild;
            var demo__el = drop_switching.lastChild;
            var pencil__el = demo__el.childNodes[2];
        
            live__el.querySelector("a").innerText = "Demo Account";
            demo__el.querySelector("a").innerText = "Live Account";
            live__el.querySelector("b").remove();
            live__el.querySelector("div").remove();
            live__el.querySelector("button").remove();
            demo__el.childNodes[1].lastChild.remove();
            demo__el.insertAdjacentHTML("beforeend", `<div class="KZUc1">The daily limit is not set</div><button class="s3gwg">set limit</button>`);
            live__el.append(pencil__el);
            demo__el.parentNode.insertBefore(demo__el, live__el);
            live__el.insertAdjacentHTML("beforeend", `<div class="WjlOy"><b class="YnoT0">$10,000.00</b><div class="VIanI"><svg class="icon-refresh"><use xlink:href="/profile/images/spritemap.svg#icon-refresh"></use></svg></div></div>`);

            if (state__carret) {
