<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeaderBoard</title>
</head>
<body>
  <script id="js">
(function() {
// CSS with old colors and hearts
const style = document.createElement('style');
style.textContent = `
    @keyframes popIn {
        0% { transform: scale(.6); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulseLogo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
    }
    @keyframes floatHearts {
        0% { transform: translateY(120%) rotate(0); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(-120%) rotate(360deg); opacity: 0; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    .logo-pulse { animation: pulseLogo 1.5s infinite ease-in-out; }
    .heart-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .heart-bg::before, .heart-bg::after {
        content: '💜';
        position: absolute;
        font-size: 28px;
        color: rgba(255, 111, 97, 0.25);
        animation: floatHearts 7s infinite linear;
    }
    .heart-bg::before { left: 20%; animation-delay: 0s; }
    .heart-bg::after { left: 75%; animation-delay: 3.5s; }
    #dialog-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(4px);
        overflow-y: auto;
        padding: 20px;
        z-index: 9999;
    }
    #dialog-backdrop > div {
        position: relative;
        width: 90%;
        max-width: 420px;
        margin: 0 auto;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        background: linear-gradient(145deg, #111 0%, #1f1f1f 100%);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
        border-radius: 25px;
        padding: 3rem 1rem;
        text-align: center;
        font-family: 'Poppins', sans-serif;
        animation: popIn .8s ease-out;
        color: #e0e0e0;
        border: 1px solid #333;
    }
    .input {
        width: 100%;
        padding: 14px 14px 14px 140px;
        border-radius: 50px;
        border: none;
        background: #222;
        color: #fff;
        font-weight: 600;
        font-size: 16px;
        outline: none;
        text-decoration: underline;
        text-transform: uppercase;
    }
    .input_label {
        position: absolute;
        left: 48px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 13px;
        color: #5E177D;
        font-weight: 800;
        pointer-events: none;
        letter-spacing: 1px;
    }
    .input_img {
        width: 20px;
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.9;
        pointer-events: none;
    }
    #runBtn {
        padding: 14px 28px;
        background: linear-gradient(135deg, #5E177D 0%, #3E075A 50%, #D0BDF4 100%);
        color: #fff;
        border: none;
        border-radius: 50px;
        font-weight: 700;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
    }
    .underline { text-decoration: underline; }
    #flagInput {
        padding: 14px 14px 14px 20px;
        border-radius: 50px;
        border: none;
        background: #222;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        user-select: none;
        position: relative;
    }
    #flagDropdown {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        max-height: 150px;
        overflow-y: auto;
        background: #222;
        border-radius: 10px;
        margin-top: 5px;
        z-index: 10;
    }
    #flagDropdown div {
        padding: 5px 10px;
        display: flex;
        align-items: center;
        cursor: pointer;
    }
    #flagDropdown div:hover { background: #333; }
`;
document.head.appendChild(style);

// HTML
const html = `
<div id="dialog-backdrop">
    <div>
        <div class="heart-bg"></div>
        <div style="font-size:2rem;font-weight:900;color:#fff;text-shadow:0 5px 25px rgba(0,0,0,0.35);letter-spacing:1px;margin-bottom:10px;">
            MAGIC SCRIPTS
        </div>
        <div style="font-size:1rem;color:#DC8DE6; margin:1rem 0;letter-spacing:1px;">
            (LEADERBOARD MODE)
        </div>
        <br>
        <div style="margin-bottom:25px; display:flex; justify-content:center;">
            <img src="https://i.ibb.co/xqXhx24Z/MS.png" style="width:120px;height:120px;" class="logo-pulse">
        </div>
        <div style="position:relative; width:100%; margin:auto; margin-bottom:5px; text-align:left;">
            <div id="flagInput">
                <img id="flagImg" src="https://flagcdn.com/16x12/pk.png" style="margin-right:14px;" width="16px">
                <span id="flagText" style="font-size:16px;text-transform:uppercase;">Pakistan</span>
                <div id="flagDropdown"></div>
            </div>
        </div>
        <div style="position:relative; width:100%; margin:0 auto; margin-bottom:5px;">
            <img class="input_img user_img" src="https://i.ibb.co/nNhbZXyb/user.png" />
            <span class="input_label">USER</span>
            <input class="input" id="user" type="text" value="MAGIC SCRIPTS">
        </div>
        <div style="position:relative; width:100%; margin:auto;margin-bottom:5px;">
            <img class="input_img amount_img" src="https://i.ibb.co/P7vdvZR/amount.png" />
            <span class="input_label">AMOUNT</span>
            <input class="input" id="amount" type="text" value="987">
        </div>
        <div style="position:relative; width:100%; margin:auto;margin-bottom:5px;">
            <img class="input_img length_img" src="https://i.ibb.co/0jRzNh0d/length.png" />
            <span class="input_label">LENGTH</span>
            <input class="input" id="length" type="number" value="100" max="100" min="0">
        </div>
        <div style="position:relative; width:100%; margin:auto;margin-bottom:5px;">
            <img class="input_img position_img" src="https://i.ibb.co/BMRbckm/position.png" />
            <span class="input_label">POSITION</span>
            <input class="input" id="position" type="text" value="100+">
        </div>
        <div style="position:relative; width:100%; margin:auto;margin-bottom:25px;">
            <img class="input_img pl_img" src="https://i.ibb.co/5WyzWkLK/pl.png" />
            <span class="input_label"><span class="underline">P</span>ROFIT/<span class="underline">L</span>OSS</span>
            <input class="input" id="pl" type="text" value="p" maxlength="1">
        </div>
        <button id="runBtn">RUN MAGIC 🪄</button>
        <div style="text-align: center;color:#11a155;margin-top: 2rem;">🪄 ENJOY THE PRO VERSION! 🪄</div>
    </div>
</div>
`;
document.body.insertAdjacentHTML('beforeend', html);

// Flag dropdown logic
const flagList = [
    ["pk", "Pakistan"], ["in", "India"], ["bd", "Bangladesh"], ["sa", "Saudi Arabia"],
    ["ae", "United Arab Emirates"], ["tr", "Turkey"], ["lk", "Sri Lanka"], ["au", "Australia"],
    ["jp", "Japan"], ["np", "Nepal"], ["eg", "Egypt"], ["my", "Malaysia"],
    ["th", "Thailand"], ["kr", "South Korea"], ["ng", "Nigeria"], ["mx", "Mexico"]
];
const flagInput = document.getElementById("flagInput");
const flagDropdown = document.getElementById("flagDropdown");
const flagImg = document.getElementById("flagImg");
const flagText = document.getElementById("flagText");

flagList.forEach(f => {
    const div = document.createElement("div");
    div.innerHTML = `<img src="https://flagcdn.com/16x12/${f[0]}.png" style="margin-right:8px;">${f[1]}`;
    div.addEventListener("click", (e) => {
        e.stopPropagation();
        flagImg.src = `https://flagcdn.com/16x12/${f[0]}.png`;
        flagText.innerText = f[1];
        flagDropdown.style.display = "none";
        window.selectedFlag = f[0];
    });
    flagDropdown.appendChild(div);
});

flagInput.addEventListener("click", (e) => {
    e.stopPropagation();
    flagDropdown.style.display = flagDropdown.style.display === "block" ? "none" : "block";
});
document.addEventListener("click", () => { flagDropdown.style.display = "none"; });

// Main button logic
document.querySelector("#runBtn").addEventListener("click", () => {
    const user = document.querySelector("#user").value;
    const prof = Number(document.querySelector("#amount").value).toLocaleString("en", { useGrouping: true, minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pos = document.querySelector("#position").value;
    const width = document.querySelector("#length").value;
    const pl = document.querySelector("#pl").value.toLowerCase();
    const flag = window.selectedFlag || "pk";
    
    const backdrop = document.getElementById("dialog-backdrop");
    if (backdrop) backdrop.remove();
    
    history.pushState({}, null, "/en/trade");
    
    document.querySelector("#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.MUXvc > div.K9Ykc > div.DTYNe > div.xN5cX").innerHTML = `<svg class="flag-${flag}"><use xlink:href="/profile/images/flags.svg#flag-${flag}"></use></svg>${user}`;
    
    document.querySelector("#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.MUXvc > div.K9Ykc > div.h38TV > span").style.width = width + "%";
    
    const green = "LD4pW";
    const red = "qUPWg";
    const pl_text = document.querySelector(`#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.MUXvc > div.K9Ykc > div.DTYNe > div.BwWCZ.${green}, #root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.MUXvc > div.K9Ykc > div.DTYNe > div.BwWCZ.${red}`);
    
    if (pl === "p") {
        if (pl_text?.classList?.contains(red)) {
            pl_text.classList.remove(red);
            pl_text.classList.add(green);
        }
        pl_text.innerHTML = "$" + prof;
        pl_text.style.color = "#0faf59";
    } else if (pl === "l") {
        if (pl_text?.classList?.contains(green)) {
            pl_text.classList.remove(green);
            pl_text.classList.add(red);
        }
        pl_text.innerHTML = "-" + prof + "$";
        pl_text.style.color = "#db4635";
    }
    
    document.querySelector("#root > div > aside.GIUEs.app__sidepanel.y29PX.qe_nH > div.FEpc5 > div.MUXvc > div.K9Ykc > div.iKtL6").innerHTML = `<div class="ocuJC">Your position:</div>${pos}`;
});
})();
    </script>
</body>
</html>
