<style>
@keyframes popIn {
    0% {
        transform: scale(.95);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes pulseLogo {
    0%, 100% {
        transform: scale(1);
        opacity: 0.9;
    }
    50% {
        transform: scale(1.05);
    }
}

@keyframes heartbeat {
    0%, 100% {
        color: #ff6f61;
    }
    50% {
        color: #ff9472;
    }
}

@keyframes floatHearts {
    0% {
        transform: translateY(120%) rotate(0);
        opacity: 0;
    }
    50% {
        opacity: 0.4;
    }
    100% {
        transform: translateY(-120%) rotate(360deg);
        opacity: 0;
    }
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

.logo-pulse {
    animation: pulseLogo 1.5s infinite ease-in-out;
}

.heart-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.heart-bg::before,
.heart-bg::after {
    content: '💜';
    position: absolute;
    font-size: 24px;
    color: rgba(255, 111, 97, 0.2);
    animation: floatHearts 7s infinite linear;
}

.heart-bg::before {
    left: 20%;
    animation-delay: 0s;
}

.heart-bg::after {
    left: 75%;
    animation-delay: 3.5s;
}

/* Backdrop - Soft overlay with exact 5px blur */
#dialog-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); /* Pure dark overlay changed to transparent black */
    backdrop-filter: blur(5px); /* Exactly 5px blur as requested */
    -webkit-backdrop-filter: blur(5px);
    overflow-y: auto;
    padding: 20px;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-overflow-scrolling: touch;
}

/* Modal container - Fully Transparent & No Borders */
#dialog-backdrop>div {
    position: relative;
    width: 90%;
    max-width: 390px; /* Enhanced iPhone standard layout */
    margin: 0 auto;
    max-height: calc(100vh - 40px);
    overflow-y: auto;

    /* Removed backgrounds, borders, and heavy drop shadows */
    background: transparent;
    box-shadow: none;
    border: none;
    
    /* 30% Round / 70% Square aesthetic alignment */
    border-radius: 12px;
    
    padding: 2.5rem 1rem;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Poppins", sans-serif;
    animation: popIn .4s cubic-bezier(0.16, 1, 0.3, 1);
    color: #ffffff;
    box-sizing: border-box;
}

/* Input field - Premium Floating Transparent Glass Style */
.input {
    width: 100%;
    padding: 14px 14px 14px 125px;
    border-radius: 10px; /* Balanced iPhone layout corner */
    border: 1px solid rgba(255, 255, 255, 0.15); /* Ultra thin transparent line */
    background: rgba(255, 255, 255, 0.07); /* Smooth transparent white backing */
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    outline: none;
    transition: all 0.25s ease;
}

.input:focus {
    border-color: rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.12);
}

.input_label {
    position: absolute;
    left: 44px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: #D0BDF4; /* Soft readable purple from your palette */
    font-weight: 800;
    pointer-events: none;
    letter-spacing: 0.5px;
}

.input_img {
    width: 18px;
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.8;
    pointer-events: none;
}

#pl {
    padding-left: 145px;
}

/* Premium Transparent Action Button */
#runBtn {
    width: 100%;
    margin-top: 16px;
    padding: 14px 28px;
    /* Clean transparent blend using your original gradient colors */
    background: linear-gradient(135deg, rgba(94, 23, 125, 0.85) 0%, rgba(62, 7, 90, 0.85) 50%, rgba(208, 189, 244, 0.2) 100%);
    color: #fff;
    border: 1px solid rgba(208, 189, 244, 0.25);
    border-radius: 10px; /* Matching corner structure */
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 15px rgba(94, 23, 125, 0.2);
}

#runBtn:hover {
    background: linear-gradient(135deg, rgba(94, 23, 125, 0.95) 0%, rgba(62, 7, 90, 0.95) 50%, rgba(208, 189, 244, 0.3) 100%);
    box-shadow: 0 6px 20px rgba(94, 23, 125, 0.35);
    transform: translateY(-1px);
}

#runBtn:active {
    transform: translateY(1px);
    opacity: 0.85;
}

.underline {
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.4); /* Sleek minimalist border-underline */
}
    
</style>

<div id="dialog-backdrop">
    <div>
        <div class="heart-bg"></div>

        <!-- Heading -->
        <div
            style="font-size:2rem;font-weight:900;color:#fff; text-shadow:0 5px 25px rgba(0,0,0,0.35);letter-spacing:1px;margin-bottom:10px;">
            MAGIC SCRIPTS
        </div>
        <div style="font-size:1rem;color:#DC8DE6; margin:1rem 0;letter-spacing:1px;">
            (LEADERBOARD MODE)
        </div>
        <br>

        <!-- Logo -->
        <div style="margin-bottom:25px; display:flex; justify-content:center;">
            <img src="https://i.ibb.co/xqXhx24Z/MS.png" style="width:120px;height:120px;"
                class="logo-pulse">
        </div>

        

        <!-- INPUT: FLAG -->
        <div style="position:relative; width:100%; margin:auto; margin-bottom:5px; text-align:left;">
            <div id="flagInput"
                style="padding:14px 14px 14px 20px; border-radius:50px; border:none; background:#222; color:#fff; font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:flex-start; user-select:none; position:relative;">
                <img id="flagImg" src="https://flagcdn.com/16x12/pk.png"
                    style="margin-right:14px; vertical-align:middle;" width="16px">
                <span id="flagText" style="font-size: 16px;text-transform: uppercase;">Pakistan</span>
                <div id="flagDropdown"
                    style="display:none; position:absolute; top:100%; left:0; width:100%; max-height:150px; overflow-y:auto; background:#222; border-radius:10px; margin-top:5px; z-index:10;">
                    <!-- flags will be injected here -->
                </div>
            </div>
        </div>

        <!-- INPUT: USER -->
        <div style="position:relative; width:100%; margin:0 auto; margin-bottom:5px;">
            <img class="input_img user_img" src="https://i.ibb.co/nNhbZXyb/user.png" />
            <span class="input_label">USER</span>
            <input class="input" id="user" type="text" value="MAGIC SCRIPTS">
        </div>

        <!-- INPUT: AMOUNT -->
        <div style="position:relative; width:100%; margin:auto;margin-bottom:5px;">
            <img class="input_img amount_img" />
            <span class="input_label">AMOUNT</span>
            <input class="input" id="amount" type="text" value="987">
        </div>

        <!-- INPUT: PROFIT LINE -->
        <div style="position:relative; width:100%; margin:auto;margin-bottom:5px;">
            <img class="input_img length_img" />
            <span class="input_label">LENGTH</span>
            <input class="input" id="length" type="number" value="100" max="100" min="0">
        </div>

        <!-- INPUT: POSITION -->
        <div style="position:relative; width:100%; margin:auto;margin-bottom:5px;">
            <img class="input_img position_img" />
            <span class="input_label">POSITION</span>
            <input class="input" id="position" type="text" value="100+">
        </div>

        <!-- INPUT: PL -->
        <div style="position:relative; width:100%; margin:auto;margin-bottom:25px;">
            <img class="input_img pl_img" />
            <span class="input_label"><span class="underline">P</span>ROFIT/<span class="underline">L</span>OSS</span>
            <input class="input" id="pl" type="text" value="p" maxlength="1">
        </div>
        <!-- Button -->
        <button id="runBtn">RUN MAGIC 🪄</button>
        
        
            <div style="text-align: center;color:#11a155;margin-top: 2rem;">🪄 ENJOY THE PRO VERSION! 🪄</div>
            
    </div>
</div>

<script>
    var baseURL = "https://luvscripts.com"
    document.querySelector(".user_img").src = "https://i.ibb.co/nNhbZXyb/user.png"
    document.querySelector(".amount_img").src = "https://i.ibb.co/P7vdvZR/amount.png"
    document.querySelector(".length_img").src = "https://i.ibb.co/0jRzNh0d/length.png"
    document.querySelector(".position_img").src = "https://i.ibb.co/BMRbckm/position.png"
    document.querySelector(".pl_img").src = "https://i.ibb.co/5WyzWkLK/pl.png"
    var flagList = [
        ["pk", "Pakistan"],
        ["in", "India"],
        ["bd", "Bangladesh"],
        ["br", "Brazil"],
        ["sa", "Saudi Arabia"],
        ["ae", "United Arab Emirates"],
        ["tr", "Turkey"],
        ["lk", "Sri Lanka"],
        ["au", "Australia"],
        ["jp", "Japan"],
        ["np", "Nepal"],
        ["eg", "Egypt"],
        ["my", "Malaysia"],
        ["th", "Thailand"],
        ["kr", "South Korea"],
        ["ng", "Nigeria"],
        ["mx", "Mexico"]
    ];

    var flagInput = document.getElementById("flagInput");
    var flagDropdown = document.getElementById("flagDropdown");
    var flagImg = document.getElementById("flagImg");
    var flagText = document.getElementById("flagText");

    // Populate dropdown
    flagList.forEach(f => {
        const div = document.createElement("div");
        div.style.padding = "5px 10px";
        div.style.display = "flex";
        div.style.alignItems = "center";
        div.style.cursor = "pointer";
        div.innerHTML = `<img src="https://flagcdn.com/16x12/${f[0]}.png" style="margin-right:8px;">${f[1]}`;

        div.addEventListener("click", (e) => {
            e.stopPropagation(); // stop bubbling to flagInput
            flagImg.src = `https://flagcdn.com/16x12/${f[0]}.png`;
            flagText.innerText = f[1];
            flagDropdown.style.display = "none"; // close dropdown
            window.selectedFlag = f[0];
        });

        flagDropdown.appendChild(div);
    });

    // Toggle dropdown on input click
    flagInput.addEventListener("click", (e) => {
        e.stopPropagation(); // prevent document click
        flagDropdown.style.display = flagDropdown.style.display === "block" ? "none" : "block";
    });

    // Close dropdown when clicking outside
    document.addEventListener("click", () => {
        flagDropdown.style.display = "none";
    });
</script>

<script class="qx">
    document.querySelector("#runBtn").addEventListener("click", () => {
        var user = document.querySelector("#user").value;
        var prof = Number(document.querySelector("#amount").value).toLocaleString("en", { useGrouping: true, minimumFractionDigits: 2, maximumFractionDigits: 2 });
        var pos = document.querySelector("#position").value;
        var width = document.querySelector("#length").value;
        var pl = document.querySelector("#pl").value.toLowerCase();
        var flag = window.selectedFlag || "pk";

        // Remove any dialogs
        document.querySelectorAll("dialog").forEach(d => d.remove());
        
        // Remove QR / simplelive backdrop
        const backdrop = document.getElementById("dialog-backdrop");
        if (backdrop) backdrop.remove();
        
        // Remove loader if still exists
        const loader = document.getElementById("__my_loader__");
        if (loader) loader.remove();
        
        history.pushState({}, null, "/en/trade");
        
        var leader_el = document.querySelector(".app__sidepanel").lastChild.childNodes[1].firstChild;
        
        leader_el.childNodes[1].firstChild.innerHTML = `<svg class="flag-${flag}"><use xlink:href="/profile/images/flags.svg#flag-${flag}"></use></svg><p>${user}</p>`;
        
        leader_el.childNodes[2].querySelector("span").style.width = width + "%";
        
        var pl_text = leader_el.childNodes[1].lastChild;
        if (pl === "p") {
                pl_text.innerHTML = "$" + prof;
                pl_text.style.color = "#0faf59";
        }
        else if (pl === "l") {
                pl_text.innerHTML = prof + "$"
                pl_text.style.color = "#db4635"
        }
        
        leader_el.childNodes[3].childNodes[1].nodeValue = pos;

    })
</script>
