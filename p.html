<style>
    @keyframes popIn {
        0% {
            transform: scale(.6);
            opacity: 0
        }

        100% {
            transform: scale(1);
            opacity: 1
        }
    }

    @keyframes pulseLogo {

        0%,
        100% {
            transform: scale(1)
        }

        50% {
            transform: scale(1.12)
        }
    }

    @keyframes heartbeat {

        0%,
        100% {
            color: #ff6f61
        }

        50% {
            color: #ff9472
        }
    }

    @keyframes floatHearts {
        0% {
            transform: translateY(120%) rotate(0);
            opacity: 0
        }

        50% {
            opacity: 0.7
        }

        100% {
            transform: translateY(-120%) rotate(360deg);
            opacity: 0
        }
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    .logo-pulse {
        animation: pulseLogo 1.5s infinite ease-in-out;
    }

    /* Heart background */
    .heart-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
    }

    .heart-bg::before,
    .heart-bg::after {
        content: '💜';
        position: absolute;
        font-size: 28px;
        color: rgba(255, 111, 97, 0.25);
        animation: floatHearts 7s infinite linear;
    }

    .heart-bg::before {
        left: 20%;
        animation-delay: 0s;
    }

    .heart-bg::after {
        left: 75%;
        animation-delay: 3.5s;
    }

    /* Backdrop */
    #dialog-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(4px);
        overflow-y: auto;
        /* scrollable */
        padding: 20px;
        z-index: 9999;
        -webkit-overflow-scrolling: touch;
        /* smooth scroll on mobile */
    }

    /* Modal container */
    #dialog-backdrop>div {
        position: relative;
        width: 90%;
        max-width: 420px;
        margin: 0 auto;
        /* horizontal center */
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        /* scroll inside modal */

        background: linear-gradient(145deg, #111 0%, #1f1f1f 100%);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
        border-radius: 25px;
        padding: 3rem 1rem;
        text-align: center;
        font-family: 'Poppins', sans-serif;
        animation: popIn .8s ease-out;
        color: #e0e0e0;
        border: 1px solid #333;
        box-sizing: border-box;
    }


    /* Input field */
    .input {
        width: 100%;
        padding: 14px 14px 14px 200px;
        border-radius: 50px;
        border: none;
        background: #222;
        color: #fff;
        font-weight: 600;
        font-size: 16px;
        outline: none;
        box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.05);
        transition: 0.3s;
        text-decoration: underline;
        text-transform: uppercase;
    }

    .input_label {
        position: absolute;
        left: 48px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        color: #5E177D;
        font-weight: 800;
        pointer-events: none;
        letter-spacing: 1px;
    }

    .input_img {
        width: 20px;
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.9;
        pointer-events: none;
    }

    #balance,
    #pay {
        padding-left: 170px;
    }


    #wd {
        padding-left: 200px;
    }
    
        #spc {

        }
    #bu {

    }

    #tx,

    /* Stylish gradient button centered on #eb3656 */
    #runBtn {
        padding: 14px 28px;
        background: linear-gradient(135deg, #5E177D 0%, #3E075A 50%, #D0BDF4 100%);
        color: #fff;
        border: none;
        border-radius: 50px;
        font-weight: 700;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
        background-size: 200% 200%;
    }

    .underline {
        text-decoration: underline;
    }
</style>
